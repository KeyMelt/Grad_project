name: rl-platform-prod

x-backend-image: &backend-image
  image: ${RL_IDE_IMAGE:-rl-platform:cloud}
  build:
    context: .
    dockerfile: Dockerfile.cloud

x-common-environment: &common-environment
  # Frontend-only vars (not passed to backend services):
  #   RL_IDE_FRONTEND_IMAGE - Docker image for the nginx/Flutter frontend (default: rl-platform-frontend:latest)
  #   RL_IDE_HTTP_BIND      - Host:port binding for the public HTTP port (default: 0.0.0.0:80)
  RL_IDE_BACKEND_HOST: 0.0.0.0
  RL_IDE_INTERNAL_TOKEN: ${RL_IDE_INTERNAL_TOKEN:?Set RL_IDE_INTERNAL_TOKEN to a generated secret}
  RL_IDE_AUTH_TOKEN_SECRET: ${RL_IDE_AUTH_TOKEN_SECRET:?Set RL_IDE_AUTH_TOKEN_SECRET to a generated secret}
  RL_IDE_AUTH_TOKEN_TTL_SECONDS: ${RL_IDE_AUTH_TOKEN_TTL_SECONDS:-43200}
  RL_IDE_SESSION_COOKIE_NAME: ${RL_IDE_SESSION_COOKIE_NAME:-__Host-rl_ide_session}
  RL_IDE_SESSION_COOKIE_SECURE: ${RL_IDE_SESSION_COOKIE_SECURE:-1}
  RL_IDE_SESSION_COOKIE_SAMESITE: ${RL_IDE_SESSION_COOKIE_SAMESITE:-lax}
  RL_IDE_SHELL_TOKEN_SECRET: ${RL_IDE_SHELL_TOKEN_SECRET:?Set RL_IDE_SHELL_TOKEN_SECRET to a generated secret}
  RL_IDE_FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_admin_key
  RL_IDE_FIREBASE_APP_NAME: ${RL_IDE_FIREBASE_APP_NAME:-rl-ide-backend}
  RL_IDE_ALLOWED_ORIGINS: ${RL_IDE_ALLOWED_ORIGINS:?Set RL_IDE_ALLOWED_ORIGINS to the deployed frontend origin}
  RL_IDE_OPEN_PROVISIONING: "0"
  RL_IDE_ALLOW_LEGACY_PASSWORD_SIGN_IN: "0"
  RL_IDE_DB_URL: sqlite:////srv/rl-platform/data/rl_learning_platform.db
  RL_IDE_VISUALIZATION_OUTPUT_DIR: /srv/rl-platform/animations
  RL_IDE_EXECUTION_TIMEOUT_BASE_SECONDS: ${RL_IDE_EXECUTION_TIMEOUT_BASE_SECONDS:-300}
  RL_IDE_EXECUTION_TIMEOUT_PER_EPISODE_SECONDS: ${RL_IDE_EXECUTION_TIMEOUT_PER_EPISODE_SECONDS:-5}
  RL_IDE_EXECUTION_TIMEOUT_MAX_SECONDS: ${RL_IDE_EXECUTION_TIMEOUT_MAX_SECONDS:-900}
  RL_IDE_MEDIA_STORAGE_BACKEND: spaces
  DO_SPACES_REGION: ${DO_SPACES_REGION:-fra1}
  DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:?Set DO_SPACES_BUCKET to the production Spaces bucket}
  DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://fra1.digitaloceanspaces.com}
  DO_SPACES_CDN_URL: ${DO_SPACES_CDN_URL:?Set DO_SPACES_CDN_URL to the production Spaces CDN URL}
  DO_SPACES_ACCESS_KEY: ${DO_SPACES_ACCESS_KEY:?Set DO_SPACES_ACCESS_KEY for media publishing}
  DO_SPACES_SECRET_KEY: ${DO_SPACES_SECRET_KEY:?Set DO_SPACES_SECRET_KEY for media publishing}
  RL_IDE_MANIM_PYTHON: python3
  RL_IDE_MANIM_SERVICE_URL: ${RL_IDE_MANIM_SERVICE_URL:-http://manim-service:8300}
  RL_IDE_GEMINI_ENABLED: ${RL_IDE_GEMINI_ENABLED:-0}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  RL_IDE_GEMINI_MODEL: ${RL_IDE_GEMINI_MODEL:-gemini-2.5-flash}
  RL_IDE_GEMINI_TIMEOUT_SECONDS: ${RL_IDE_GEMINI_TIMEOUT_SECONDS:-5}
  RL_IDE_STUDY_BUDDY_AI_ENABLED: ${RL_IDE_STUDY_BUDDY_AI_ENABLED:-1}
  RL_IDE_STUDY_BUDDY_LLM_TIMEOUT_SECONDS: ${RL_IDE_STUDY_BUDDY_LLM_TIMEOUT_SECONDS:-8}

x-common-service: &common-service
  <<: *backend-image
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  volumes:
    - /srv/rl-platform/data:/srv/rl-platform/data
    - /srv/rl-platform/animations:/srv/rl-platform/animations
    - /srv/rl-platform/concept-videos:/srv/rl-platform/concept-videos
  secrets:
    - firebase_admin_key

services:
  gateway:
    <<: *common-service
    environment:
      <<: *common-environment
      SERVICE_NAME: gateway
      RL_IDE_GATEWAY_PORT: "8000"
      RL_IDE_EXECUTION_MODE: remote
      RL_IDE_EXECUTION_WORKER_URL: http://execution-worker:8100
      RL_IDE_USER_SERVICE_MODE: remote
      RL_IDE_USER_SERVICE_URL: http://user-evaluation:8200
      RL_IDE_BOOTSTRAP_ADMIN_FIREBASE_UID: ${RL_IDE_BOOTSTRAP_ADMIN_FIREBASE_UID:-}
      RL_IDE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${RL_IDE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Platform Admin}
    ports:
      - "${RL_IDE_GATEWAY_BIND:-127.0.0.1:8000}:8000"
    depends_on:
      execution-worker:
        condition: service_healthy
      user-evaluation:
        condition: service_healthy
      manim-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  execution-worker:
    <<: *common-service
    environment:
      <<: *common-environment
      SERVICE_NAME: execution-worker
      RL_IDE_EXECUTION_WORKER_PORT: "8100"
      RL_IDE_WORKSPACE_BASE_DIR: /srv/rl-platform/data/workspaces
      RL_IDE_JOB_STORE_PATH: /srv/rl-platform/data/execution_jobs.db
      RL_IDE_WORKSPACE_STORE_PATH: /srv/rl-platform/data/workspace_state.db
      RL_IDE_ARTIFACT_STORE_PATH: /srv/rl-platform/data/execution_artifacts.db
      RL_IDE_WORKSPACE_USE_DOCKER: ${RL_IDE_WORKSPACE_USE_DOCKER:-1}
      RL_IDE_WORKSPACE_IMAGE: ${RL_IDE_WORKSPACE_IMAGE:-python:3.11-slim}
    volumes:
      - /srv/rl-platform/data:/srv/rl-platform/data
      - /srv/rl-platform/animations:/srv/rl-platform/animations
      - /srv/rl-platform/concept-videos:/srv/rl-platform/concept-videos
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; req = urllib.request.Request('http://127.0.0.1:8100/internal/workspace/health', headers={'X-Internal-Token': os.environ['RL_IDE_INTERNAL_TOKEN']}); urllib.request.urlopen(req, timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-evaluation:
    <<: *common-service
    environment:
      <<: *common-environment
      SERVICE_NAME: user-evaluation
      RL_IDE_USER_EVALUATION_PORT: "8200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  manim-service:
    <<: *backend-image
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      SERVICE_NAME: manim-service
      RL_IDE_BACKEND_HOST: 0.0.0.0
      RL_IDE_MANIM_SERVICE_PORT: "8300"
      MANIM_PYTHON: python3
      SHARED_MEDIA_DIR: /srv/rl-platform/animations
      RENDER_QUALITY: ${RL_IDE_MANIM_RENDER_QUALITY:-l}
      QUEUE_BACKEND: memory
      FFMPEG_BIN: ffmpeg
      RL_IDE_MEDIA_STORAGE_BACKEND: spaces
      DO_SPACES_REGION: ${DO_SPACES_REGION:-fra1}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:?Set DO_SPACES_BUCKET to the production Spaces bucket}
      DO_SPACES_ENDPOINT: ${DO_SPACES_ENDPOINT:-https://fra1.digitaloceanspaces.com}
      DO_SPACES_CDN_URL: ${DO_SPACES_CDN_URL:?Set DO_SPACES_CDN_URL to the production Spaces CDN URL}
      DO_SPACES_ACCESS_KEY: ${DO_SPACES_ACCESS_KEY:?Set DO_SPACES_ACCESS_KEY for media publishing}
      DO_SPACES_SECRET_KEY: ${DO_SPACES_SECRET_KEY:?Set DO_SPACES_SECRET_KEY for media publishing}
    volumes:
      - /srv/rl-platform/animations:/srv/rl-platform/animations
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${RL_IDE_FRONTEND_IMAGE:-rl-platform-frontend:latest}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      RL_IDE_TLS_DOMAIN: ${RL_IDE_TLS_DOMAIN:-reinfource.app}
    ports:
      - "${RL_IDE_HTTP_BIND:-0.0.0.0:80}:80"
      - "${RL_IDE_HTTPS_BIND:-0.0.0.0:443}:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  firebase_admin_key:
    file: ${RL_IDE_FIREBASE_CREDENTIALS_FILE:?Set RL_IDE_FIREBASE_CREDENTIALS_FILE to the Firebase service-account JSON path}
