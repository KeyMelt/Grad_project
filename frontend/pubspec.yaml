name: rl_ide
description: "Reinforcement Learning IDE - Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_math_fork: ^0.7.4
  markdown: ^7.2.2
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  webview_flutter: ^4.13.0
  multicast_dns: ^0.3.3
  mcp_toolkit: ^3.0.0
  flutter_markdown_plus: ^1.0.7
  flutter_markdown_plus_latex: ^1.0.5
  file_picker: ^11.0.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/screenshots/
