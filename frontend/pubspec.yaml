name: rl_ide
description: "Reinforcement Learning IDE - Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  flutter_math_fork: ^0.7.4
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  video_player: ^2.9.2
  webview_flutter: ^4.13.0
  multicast_dns: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
