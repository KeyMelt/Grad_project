[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
(
  backend/api_gateway/static
  | backend/visualization/animations
  | backend/data
  | media
  | tmp
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "backend/api_gateway/static",
  "backend/visualization/animations",
  "backend/data",
  "frontend",
  "media",
  "tmp",
]

[tool.ruff.lint]
select = [
  "E9",
  "F",
]
ignore = [
  "F403",
  "F405",
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
