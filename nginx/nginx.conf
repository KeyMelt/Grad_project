server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable access log for favicon requests
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Gateway-owned static assets for the embedded workspace shell
    location ^~ /static/ {
        proxy_pass http://gateway:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter entrypoints are not fingerprinted, so never serve stale shells.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
        try_files $uri =404;
    }

    # Static asset caching
    location ~* \.(js|css|woff|woff2|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket upgrade for workspace console sessions (must come BEFORE generic API proxy)
    location ~ ^/workspace/sessions/[^/]+/console {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # API and media routes proxied to backend gateway
    location ~ ^/(health|ready|auth|lessons|execution|workspace|quiz|admin|staff|concept-videos|visualization|study-buddy|me|evaluation|telemetry|media|artifacts|tasks|submit|execute)(/.*)?$ {
        proxy_pass http://gateway:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter SPA catch-all — always serve index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
